<div class="d-flex justify-content-end mb-2" *ngIf="esAdmin()">
  <button class="btn btn-primary btn-sm d-flex align-items-center gap-1" (click)="abrirModal()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
    </svg>
    Agregar solicitud
  </button>
</div>

<!-- Modal Independiente -->
<app-modal-solicitud 
  #modalSolicitud
  (solicitudGuardada)="onSolicitudGuardada($event)"
></app-modal-solicitud>

<ejs-grid #grid id="grid"
allowReordering='true' 
[dataSource]="solicitudes" 
      allowSelection="false"
      [selectionSettings]="selectOptions" 
      [editSettings]='editSettings'
       allowPaging="true" 
       [allowFiltering]="true"
      [filterSettings]='filterSettings'
       allowSorting="true"
       allowResizing='true'
      [pageSettings]="pageSettings"
(dataBound)='dataBound()' 
>
      <e-columns>
        
       <e-column field='prefijo' headerText='Solicitud' width='150'></e-column>
        <e-column field='proveedor' headerText='Proveedor' width='120' ></e-column>        
        <e-column field='nombre' headerText='Nombre' width='120' ></e-column>        
        <e-column field='fecha_registro' [allowFiltering]="false" headerText='Fecha de registro'  width='120' >
          <ng-template #template let-data>
            {{ data.fecha_registro | date:'dd-MM-yyyy' }}
          </ng-template>
        </e-column>
        <e-column field='estado' headerText='Tipo de movimiento' width='180' [template]='estadoTemplate'></e-column>
<e-column field='totalNotas' headerText='Total de notas' width='150'></e-column>
        <e-column headerText='Acciones' width='100' [template]='actionTemplate'></e-column>
      </e-columns>

      <ng-template #estadoTemplate let-data>
        <span class="combo-estado" [ngClass]="claseEstado(data.id_estado)">
          {{ data.estado }}
        </span>
      </ng-template>

      <ng-template #actionTemplate let-data>
        <button class="btn btn-sm btn-outline-primary d-inline-flex align-items-center justify-content-center" (click)="verDetalleSolicitud(data)" title="Ver detalle">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
          </svg>
        </button>
      </ng-template>
