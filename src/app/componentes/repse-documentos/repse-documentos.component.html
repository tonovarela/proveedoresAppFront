<div class="repse-documentos animated fadeIn">

    <!-- Panel tipo tab que engloba todo el componente -->
    <div class="tab-panel">
        <div class="tab-panel__tab">Documentos REPSE</div>

        <div class="tab-panel__body">
            <div class="row">
                <div class="col-6">
                    <div class="card doc-card doc-card--zip">
                        <div class="card-body doc-card__body">
                            <ng-container *ngTemplateOutlet="iconZip"></ng-container>
                            <div class="doc-card__content">
                                <span class="doc-card__badge">ZIP · XML</span>
                                <h4 class="card-title doc-card__title">Recibo de nómina Trabajadores XML</h4>
                                <button type="button" (click)="subirArchivo()" class="btn doc-card__btn waves-effect waves-light"><i class="fa fa-upload"></i>Subir archivo</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card doc-card doc-card--zip">
                        <div class="card-body doc-card__body">
                            <ng-container *ngTemplateOutlet="iconZip"></ng-container>
                            <div class="doc-card__content">
                                <span class="doc-card__badge">ZIP · PDF</span>
                                <h4 class="card-title doc-card__title">Recibo de nómina Trabajadores PDF</h4>
                                <button type="button" (click)="subirArchivo()" class="btn doc-card__btn waves-effect waves-light"><i class="fa fa-upload"></i>Subir archivo</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-6" *ngFor="let doc of DocumentosRepse">
                    <div class="card doc-card doc-card--pdf">
                        <div class="card-body doc-card__body">
                            <ng-container *ngTemplateOutlet="iconPdf"></ng-container>
                            <div class="doc-card__content">
                                <span class="doc-card__badge">PDF</span>
                                <h4 class="card-title doc-card__title">{{doc.descripcion}}</h4>
                                <button type="button" (click)="subirArchivo()" class="btn doc-card__btn waves-effect waves-light"><i class="fa fa-upload"></i>Subir archivo</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- ===== Iconos SVG reutilizables ===== -->
<ng-template #iconZip>
    <svg class="doc-card__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M14 2v6h6" stroke="#F59E0B" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M11 4h2M9 6h2M11 8h2M9 10h2M11 12h2" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="9" y="13.5" width="4" height="5" rx="1" fill="#F59E0B"/>
    </svg>
</ng-template>

<ng-template #iconPdf>
    <svg class="doc-card__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" fill="#FCE7EF" stroke="#E0457B" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M14 2v6h6" stroke="#E0457B" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="12" y="17.5" text-anchor="middle" font-size="5.5" font-weight="700" fill="#E0457B" font-family="Arial, sans-serif">PDF</text>
    </svg>
</ng-template>
